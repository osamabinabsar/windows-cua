name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest tests/ -q

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The installer edits the user's real config files in place, so the
      # surgery that removes one entry has to leave the rest alone. These
      # tests take the functions out of install.ps1 and run them against
      # strings in memory -- they never touch a real config.
      - name: Test the installer's config surgery
        shell: pwsh
        run: ./tests/test_install_config.ps1
